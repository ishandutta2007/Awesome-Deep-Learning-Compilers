<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1) translate(0, 0); }
        50% { opacity: 0.65; transform: scale(1.08) translate(15px, -10px); }
      }
      @keyframes floatOrb {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-25px, 20px); }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes badgePulse {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.9; }
      }
      .anim-glow1 {
        animation: pulseGlow 8s ease-in-out infinite alternate;
        transform-origin: 300px 150px;
      }
      .anim-glow2 {
        animation: floatOrb 10s ease-in-out infinite alternate;
        transform-origin: 900px 250px;
      }
      .anim-flow {
        stroke-dasharray: 12, 18;
        animation: flowDash 14s linear infinite;
      }
      .anim-badge-border {
        animation: badgePulse 4s ease-in-out infinite alternate;
      }
      .chip-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.8px;
        fill: #94a3b8;
      }
      .chip-val {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Ambient Dynamic Glowing Orbs (Background layer) -->
  <circle cx="280" cy="140" r="160" fill="url(#glowGrad1)" filter="url(#blurFilter)" class="anim-glow1" />
  <circle cx="940" cy="260" r="180" fill="url(#glowGrad2)" filter="url(#blurFilter)" class="anim-glow2" />

  <!-- Dynamic Compiler Graph Data Flow Lines (Midground background) -->
  <g opacity="0.45">
    <path d="M 80 80 Q 300 20 600 80 T 1120 70" fill="none" stroke="url(#lineGrad)" stroke-width="2" class="anim-flow" />
    <path d="M 90 340 Q 400 390 700 330 T 1110 350" fill="none" stroke="url(#lineGrad)" stroke-width="2" class="anim-flow" />
    <path d="M 120 200 C 350 120, 450 280, 750 190 S 1020 230, 1080 170" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" class="anim-flow" />
  </g>

  <!-- Subtle Graph Pipeline Nodes in Background -->
  <g opacity="0.3" filter="url(#softGlow)">
    <circle cx="160" cy="80" r="4" fill="#38bdf8" />
    <circle cx="360" cy="46" r="3" fill="#818cf8" />
    <circle cx="600" cy="80" r="5" fill="#a855f7" />
    <circle cx="880" cy="62" r="3" fill="#ec4899" />
    <circle cx="1060" cy="72" r="4" fill="#38bdf8" />
  </g>

  <!-- Floating Tech Ecosystem Badges (Behind main text, well-spaced) -->
  <g transform="translate(70, 35)">
    <rect width="105" height="28" rx="14" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1" class="anim-badge-border" opacity="0.75" />
    <text x="52" y="18" text-anchor="middle" class="chip-text">⚙️ TVM</text>
  </g>
  <g transform="translate(190, 35)">
    <rect width="125" height="28" rx="14" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1" class="anim-badge-border" opacity="0.75" />
    <text x="62" y="18" text-anchor="middle" class="chip-text">🚀 TENSORRT</text>
  </g>
  <g transform="translate(885, 35)">
    <rect width="115" height="28" rx="14" fill="url(#pillGrad)" stroke="#a855f7" stroke-width="1" class="anim-badge-border" opacity="0.75" />
    <text x="57" y="18" text-anchor="middle" class="chip-text">⚡ TRITON</text>
  </g>
  <g transform="translate(1015, 35)">
    <rect width="115" height="28" rx="14" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1" class="anim-badge-border" opacity="0.75" />
    <text x="57" y="18" text-anchor="middle" class="chip-text">📦 ONNX RT</text>
  </g>

  <!-- FOREGROUND LAYER: Title, Subtitle, & Primary Badges -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 115)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="0" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2px" fill="#38bdf8">CURATED AWESOME ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1px" fill="url(#titleGrad)">
    Awesome Deep Learning Compilers
  </text>

  <!-- Subtitle -->
  <text x="600" y="228" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1" letter-spacing="0.2px">
    Model Optimization • Kernel Code Generation • Hardware Acceleration • Production Inference
  </text>

  <!-- Metric Pills / Architecture Highlights (Foreground bottom row) -->
  <g transform="translate(240, 280)">
    <rect width="210" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <circle cx="24" cy="21" r="7" fill="#10b981" />
    <text x="44" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Graph Compilation</text>
  </g>

  <g transform="translate(485, 280)">
    <rect width="230" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <circle cx="24" cy="21" r="7" fill="#6366f1" />
    <text x="44" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Kernel &amp; Operator Fusion</text>
  </g>

  <g transform="translate(750, 280)">
    <rect width="210" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <circle cx="24" cy="21" r="7" fill="#0ea5e9" />
    <text x="44" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Multi-Silicon Backends</text>
  </g>

  <!-- Bottom Hardware Targets Row -->
  <text x="600" y="370" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b" letter-spacing="1.5px">
    NVIDIA CUDA / TENSORRT • APPLE NEURAL ENGINE • INTEL ONEAPI / OPENVINO • AMD ROCM • ARM NEON • AWS INFERENTIA
  </text>

  <!-- Banner Outer Border -->
  <rect width="1200" height="420" rx="16" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />
</svg>
